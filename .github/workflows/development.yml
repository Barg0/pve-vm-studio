# The development channel: every push to main is built and published as the rolling
# pre-release "development" - the studio's Version card (Development) offers it. Untested by design.
name: development
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: development
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release
      - run: cargo build --release
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Assets
        run: |
          mkdir dist
          # The licenses of every crate in the binary, as their MIT/Apache terms ask.
          cargo about generate about.hbs -o dist/THIRD-PARTY-LICENSES.html
          cp target/release/pve-vm-studio dist/pve-vm-studio-x86_64
          cp deploy/install.sh deploy/update-lxc.sh deploy/pve-vm-studio.service deploy/pvs-update.sh \
             deploy/pve-vm-studio-update.path deploy/pve-vm-studio-update.service \
             deploy/pve-vm-studio-console.service dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish development
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete development --yes --cleanup-tag || true
          gh release create development dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Development build $GITHUB_SHA" \
            --notes "Development build $GITHUB_SHA - main, untested. $(git log -1 --format=%s)"
          # gh creates the release as a draft, uploads, then publishes - right after the old
          # tag was deleted that last step can be lost (2026-10-05: left as a draft, which the
          # studio's anonymous API call cannot see). Published explicitly, and checked.
          gh release edit development --draft=false --prerelease
          test "$(gh release view development --json isDraft --jq .isDraft)" = "false"
