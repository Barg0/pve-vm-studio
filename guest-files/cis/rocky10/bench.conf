# The benchmark this folder implements (pvs-cis picks it by /etc/os-release). AlmaLinux, Oracle
# and Rocky Linux 10 are one text: the map is el10/map.tsv.
BENCHMARK="CIS Rocky Linux 10 Benchmark"
VERSION="1.0.0"
DISTRO="rocky-10.*"
FAMILY="deb el"
MAP="el10"
# The benchmark has no 32-bit audit rules (b64 only).
AUDIT_B32="no"
# 1.6.4: CBC off in the system-wide cipher list too, not only for SSH.
CP_CBC_GLOBAL="yes"
# 6.3.3.26: the SELinux policy directories the benchmark names.
AUDIT_MAC_DIRS="/etc/selinux /usr/share/selinux"
# 5.1.2/5.1.3: every OpenSSH key file under /etc/ssh, not only the HostKey entries.
SSH_KEYS_SCAN="all"
# 6.1.2: aidecheck.service enabled as well as the timer.
AIDE_SVC="yes"
# 6.2.3.4: only the legacy $FileCreateMode counts (the audit greps nothing else).
RSYSLOG_FCM="legacy"
# 2.4.1.7: a missing /etc/cron.yearly is not called a pass here - created 0700.
CRON_YEARLY_OPTIONAL="no"
