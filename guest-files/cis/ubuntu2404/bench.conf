# The benchmark this folder implements (pvs-cis picks it by /etc/os-release).
BENCHMARK="CIS Ubuntu Linux 24.04 LTS Benchmark"
VERSION="2.0.0"
DISTRO="ubuntu-24.04"
FAMILY="deb"
# Audit watches as the benchmark writes them: -w PATH -p PERM (every ABI).
AUDIT_WATCH="w"
# The audit tool lists include /sbin/autrace.
AUDIT_AUTRACE="yes"
# sudo or sudo-ldap, a logfile, the default timestamp_timeout accepted (5.2.x).
SUDO_STYLE="classic"
# 5.4.3.3: umask "027 or more restrictive" by value (the audit has no pattern).
UMASK_AUDIT="bits"
# 1.6.1: the motd audit also reads /run, /usr/lib and update-motd.d.
MOTD_ALL="yes"
# 1.2.1.1: the audit lists every sources file without a Signed-By line (per file, not per entry).
APT_SIGNEDBY_AUDIT="file"
# 6.2.3.x path rules with auid filters (chcon, setfacl, chacl, usermod): no arch, as the audit prints them.
AUDIT_PATHRULE="noarch"
# 1.5.10 has no body in the v2.0.0 PDF (only its title in the table and the change log):
# implemented as Ubuntu 26.04 v1.0.0 1.5.10 audits it (a hard core 0 limit for all users).
