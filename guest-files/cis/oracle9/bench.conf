# The benchmark this folder implements (pvs-cis picks it by /etc/os-release). AlmaLinux, Oracle
# and Rocky Linux 9 are one text: the map is el9/map.tsv.
BENCHMARK="CIS Oracle Linux 9 Benchmark"
VERSION="3.0.0"
DISTRO="ol-9.*"
FAMILY="deb el"
MAP="el9"
# Audit watches as the benchmark writes them: -S all without an arch (every ABI).
AUDIT_WATCH="all"
# 1.6.4: CBC off in the system-wide cipher list too, not only for SSH.
CP_CBC_GLOBAL="yes"
# 6.x.3.2: execveat with execve.
AUDIT_EXECVEAT="yes"
