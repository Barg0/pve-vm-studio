# The benchmark this folder implements (pvs-cis picks it by /etc/os-release). CIS publishes no
# benchmark for openSUSE: Leap 16.0 is built from SUSE Linux Enterprise 16's sources, so the
# SLE 16 one is applied to it - the report says so; it is not a benchmark for Leap.
BENCHMARK="CIS SUSE Linux Enterprise 16 Benchmark"
VERSION="1.0.0"
DISTRO="opensuse-leap-16.*"
FAMILY="deb el suse"
MAP="sle16"
# The benchmark has no 32-bit audit rules (b64 only).
AUDIT_B32="no"
# The audit tool lists have no autrace.
AUDIT_AUTRACE="no"
# 6.3.2: aidecheck.service enabled as well as the timer.
AIDE_SVC="yes"
