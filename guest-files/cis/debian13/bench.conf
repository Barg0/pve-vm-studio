# The benchmark this folder implements (pvs-cis picks it by /etc/os-release). Debian 13 v1.1.0
# has Ubuntu 26.04 v1.0.0's recommendations, number for number - the same map.
BENCHMARK="CIS Debian Linux 13 Benchmark"
VERSION="1.1.0"
DISTRO="debian-13"
FAMILY="deb"
# sudo-rs preferred, journal or logfile, timestamp_timeout set explicitly (5.2.x).
SUDO_STYLE="rs"
# 6.x.3.2: execveat with execve.
AUDIT_EXECVEAT="yes"
