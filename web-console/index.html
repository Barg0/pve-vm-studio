<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Maintenance console</title>
<link rel="stylesheet" href="console.css">
<script>try { const t = localStorage.getItem("pvs-console-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div class="bar" id="bar">
  <b class="bar-title">Maintenance console</b>
  <span class="bar-host" id="barHost">PVE VM Studio</span>
  <span class="bar-right" id="barRight"></span>
</div>
<div class="wrap" id="wrap"></div>
<script src="console.js"></script>
</body>
</html>
