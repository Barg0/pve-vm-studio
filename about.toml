# cargo-about: the licenses the studio's dependencies may carry. A crate under anything else
# fails the release, so a new license is a deliberate decision, not an accident.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
# Linux x86_64 is the only target the studio ships for.
targets = ["x86_64-unknown-linux-gnu"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
